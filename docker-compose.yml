services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: api_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/api_db
    depends_on:
      - db

  frontend-angular:
    build: ./frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - backend

  frontend-react:
    build: ./frontend-react
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: